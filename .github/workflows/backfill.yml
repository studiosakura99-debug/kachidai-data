name: KachiDai backfill history
on:
  workflow_dispatch:
    inputs:
      per_store:
        description: "1店舗あたり取得する過去リポート数"
        default: "12"
        required: false
      budget:
        description: "この実行で取得する最大リポート数"
        default: "700"
        required: false
permissions:
  contents: write
concurrency:
  group: kachidai-collect
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Backfill past reports (Miyagi only)
        env:
          KD_INTERVAL: "1.0"
          KD_BUDGET: ${{ github.event.inputs.budget }}
          KD_PER_STORE: ${{ github.event.inputs.per_store }}
        run: python3 collect_safe.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kachidai-backfill
          path: |
            latest.csv
            collect_blocked.txt
          if-no-files-found: warn
      - name: Commit
        run: |
          git config user.name "kachidai-bot"
          git config user.email "kachidai-bot@users.noreply.github.com"
          git add -A
          git commit -m "data: backfill history $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no change"
          for i in 1 2 3 4 5 6; do git pull --rebase --autostash origin main && git push origin HEAD:main && break; sleep 10; done
