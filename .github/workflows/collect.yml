name: KachiDai data collect
on:
  schedule:
    # JST 07:00 / 12:00 / 15:00 / 17:00 / 24:00 (= UTC 22:00 / 03:00 / 06:00 / 08:00 / 15:00)
    - cron: '0 3,6,8,15,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kachidai-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect min-repo (Miyagi only, incremental)
        env:
          KD_INTERVAL: "6.0"
          KD_BUDGET: "90"
          KD_PER_STORE: "3"
        run: python3 collect_safe.py
      - name: Upload CSV artifact (push失敗でもデータを失わない)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kachidai-csv
          path: |
            latest.csv
            outside_ids.txt
            id_verdicts.txt
            collect_blocked.txt
          if-no-files-found: warn
      - name: Commit
        run: |
          git config user.name "kachidai-bot"
          git config user.email "kachidai-bot@users.noreply.github.com"
          git add -A
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no change"
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
            echo "push retry $i"; sleep 15
          done
          [ "$ok" = "1" ] || { echo "push failed after retries"; exit 1; }
