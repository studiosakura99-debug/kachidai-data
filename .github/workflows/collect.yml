name: KachiDai data collect
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Collect min-repo (Miyagi only) -> latest.csv
        env:
          KD_INTERVAL: "2.0"
          KD_MAX: "460"
        run: python3 collect.py
      - name: Commit
        run: |
          git config user.name "kachidai-bot"
          git config user.email "kachidai-bot@users.noreply.github.com"
          git add latest.csv outside_ids.txt
          git commit -m "data: $(date -u +%Y-%m-%d)" || echo "no change"
          git push
